<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#eef1ec;
    --surface:#ffffff;
    --ink:#1b231f;
    --ink-soft:#57645d;
    --line:#d3dad2;
    --moss:#3c6a58;
    --moss-deep:#2a4c3f;
    --moss-soft:#dde8e2;
    --clay:#a15a35;
    --clay-soft:#f3e2d7;
    --shadow: 0 1px 2px rgba(27,35,31,0.06), 0 4px 14px rgba(27,35,31,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121613; --surface:#1a201c; --ink:#eef1ec; --ink-soft:#a9b3ac;
      --line:#2b332e; --moss:#7db69b; --moss-deep:#9ccbb2; --moss-soft:#22322a;
      --clay:#e0996c; --clay-soft:#33261e;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121613; --surface:#1a201c; --ink:#eef1ec; --ink-soft:#a9b3ac;
    --line:#2b332e; --moss:#7db69b; --moss-deep:#9ccbb2; --moss-soft:#22322a;
    --clay:#e0996c; --clay-soft:#33261e;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    margin:0; padding:0 20px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding-block:36px 64px; display:flex; flex-direction:column; gap:24px; }
  .narrow{ max-width:640px; margin:0 auto; width:100%; }
  header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:18px; }
  .title-block h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.6rem; letter-spacing:-0.01em; margin:0; }
  .title-block p{ margin:4px 0 0; color:var(--ink-soft); font-size:0.85rem; }
  #settingsBtn{ background:none; border:1px solid var(--line); color:var(--ink-soft); width:34px; height:34px; border-radius:8px; font-size:1rem; cursor:pointer; flex:none; }
  #settingsBtn:hover{ color:var(--ink); border-color:var(--moss); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{ outline:2px solid var(--moss); outline-offset:2px; }
  [hidden]{ display:none !important; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; box-shadow:var(--shadow); }
  .panel h2{ font-family:"Fraunces", Georgia, serif; font-size:1.1rem; font-weight:600; margin:0 0 6px; }
  .panel p{ margin:0 0 12px; color:var(--ink-soft); font-size:0.92rem; line-height:1.5; }
  .panel ol{ margin:0 0 16px; padding-left:1.2em; color:var(--ink-soft); font-size:0.92rem; line-height:1.6; }
  .panel a{ color:var(--moss-deep); }
  label{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:500; }
  input[type="text"], input[type="password"], select, textarea{
    width:100%; font-family:inherit; font-size:0.98rem; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:11px 12px;
  }
  input[type="text"], input[type="password"], select{ height:44px; }
  textarea{ resize:vertical; min-height:88px; line-height:1.4; }
  select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M5 8l5 5 5-5' fill='none' stroke='%237c8880' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:14px; padding-right:34px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row .field{ flex:1 1 220px; }
  button.primary{
    font-family:inherit; font-weight:600; font-size:0.94rem; background:var(--moss); color:var(--paper);
    border:none; border-radius:8px; padding:0 18px; height:44px; cursor:pointer; flex:none;
  }
  button.primary:hover{ background:var(--moss-deep); }
  button.ghost{
    font-family:inherit; font-size:0.88rem; background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; padding:0 14px; height:44px; cursor:pointer;
  }
  button.ghost:hover{ color:var(--ink); border-color:var(--moss); }
  .notice{ font-size:0.88rem; padding:12px 14px; border-radius:8px; background:var(--clay-soft); color:var(--clay); border:1px solid transparent; }
  .notice.ok{ background:var(--moss-soft); color:var(--moss-deep); }
  .empty{ color:var(--ink-soft); font-size:0.9rem; padding:8px 4px; }

  #todayView{ display:flex; flex-direction:column; gap:16px; }
  #tasksView{ display:flex; flex-direction:column; gap:16px; }
  #historyContent{ display:flex; flex-direction:column; gap:16px; }

  .date-heading{ font-family:"Fraunces", Georgia, serif; font-size:1.1rem; font-weight:600; margin:0; }

  #events{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; align-items:start; }
  .event-card{ display:flex; flex-direction:column; gap:12px; }
  .event-card .event-time{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.78rem; color:var(--ink-soft); }
  .event-card .event-title{ font-size:1.02rem; font-weight:600; margin:2px 0 0; }

  .segmented{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg-group{ display:flex; flex-direction:column; gap:6px; }
  .seg-buttons{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg-btn{
    font-family:inherit; font-size:0.86rem; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:7px; padding:7px 14px; cursor:pointer;
  }
  .seg-btn[aria-pressed="true"]{ background:var(--moss); border-color:var(--moss); color:var(--paper); }
  .seg-btn.no[aria-pressed="true"]{ background:var(--clay); border-color:var(--clay); }

  .save-state{ font-size:0.76rem; color:var(--ink-soft); font-family:"IBM Plex Mono", ui-monospace, monospace; }

  table.hist{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  table.hist th, table.hist td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  table.hist th{ color:var(--ink-soft); font-weight:500; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.04em; }

  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); }
  .tab-btn{ font-family:inherit; font-size:0.9rem; background:none; border:none; color:var(--ink-soft); padding:10px 4px; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--moss); font-weight:600; }

  .badge{ font-size:0.68rem; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap; letter-spacing:0.02em; }
  .badge.not_started{ background:var(--line); color:var(--ink-soft); }
  .badge.in_progress{ background:var(--moss-soft); color:var(--moss-deep); }
  .badge.paused{ background:var(--clay-soft); color:var(--clay); }
  .badge.completed{ background:var(--moss); color:var(--paper); }

  .chips{ display:flex; flex-direction:column; gap:8px; }
  .chip{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .chip .chip-name{ flex:1 1 100px; font-size:0.9rem; min-width:0; }
  .chip button.remove{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.95rem; padding:2px 4px; flex:none; }
  .chip button.remove:hover{ color:var(--clay); }

  .combo{ position:relative; }
  .combo-dropdown{ position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); max-height:220px; overflow-y:auto; z-index:10; }
  .combo-option{ padding:9px 12px; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .combo-option:hover{ background:var(--moss-soft); }
  .combo-option.create{ color:var(--moss-deep); font-weight:600; }

  .task-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .task-row:last-child{ border-bottom:none; }
  .task-row-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .task-row-name{ background:none; border:none; padding:0; font:inherit; font-size:0.94rem; font-weight:500; color:var(--ink); text-align:left; cursor:pointer; }
  .task-row-name:hover{ text-decoration:underline; color:var(--moss-deep); }
  .task-row-date{ font-size:0.76rem; color:var(--ink-soft); }
  .task-row select{ width:auto; flex:none; }

  .history-item{ font-size:0.85rem; padding:7px 0; border-bottom:1px solid var(--line); color:var(--ink-soft); }
  .history-item:last-child{ border-bottom:none; }
  .history-item b{ color:var(--ink); font-weight:500; }

  footer{ text-align:center; font-size:0.76rem; color:var(--ink-soft); padding-top:8px; }
</style>

<div class="wrap">
  <header class="narrow">
    <div class="title-block">
      <h1>Day Tracker</h1>
      <p>Today's calendar blocks — attended, productive, tasks done.</p>
    </div>
    <button id="settingsBtn" type="button" aria-label="Settings" hidden>⚙</button>
  </header>

  <section id="setup" class="panel narrow">
    <h2>Connect Google</h2>
    <p>Reads today's events from your Google Calendar and logs your check-offs into a Google Sheet you own. Nothing goes anywhere else.</p>
    <div class="field">
      <label for="sheetInput">Google Sheet URL or ID</label>
      <input id="sheetInput" type="text" placeholder="Paste the URL of a blank Google Sheet (sheets.new)">
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="primary" id="saveSheetBtn" type="button">Save sheet</button>
    </div>
    <div id="setupFeedback" style="margin-top:12px;"></div>
    <div class="row" style="margin-top:16px;" id="signInRow" hidden>
      <button class="primary" id="signInBtn" type="button">Sign in with Google</button>
    </div>
  </section>

  <section id="settingsPanel" class="panel narrow" hidden>
    <h2>Settings</h2>
    <div class="field">
      <label for="sheetInput2">Google Sheet URL or ID</label>
      <input id="sheetInput2" type="text">
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="primary" id="updateSheetBtn" type="button">Update sheet</button>
      <button class="ghost" id="signOutBtn" type="button">Sign out</button>
      <button class="ghost" id="closeSettingsBtn" type="button">Close</button>
    </div>
    <div class="row" style="margin-top:16px;">
      <button class="ghost" id="seedDataBtn" type="button">Add sample test data</button>
    </div>
    <div id="seedFeedback" style="margin-top:10px;"></div>
  </section>

  <section id="app" hidden>
    <div class="tabs">
      <button class="tab-btn" id="todayTab" type="button" aria-selected="true">Today</button>
      <button class="tab-btn" id="tasksTab" type="button" aria-selected="false">Tasks</button>
      <button class="tab-btn" id="historyTab" type="button" aria-selected="false">History</button>
    </div>

    <div id="feedback"></div>

    <div id="todayView">
      <p class="date-heading" id="todayHeading"></p>
      <div id="events"></div>
    </div>

    <div id="tasksView" hidden>
      <div id="taskListPage">
        <div class="panel">
          <div class="row" style="justify-content:space-between;">
            <div class="row" style="gap:20px;">
              <div class="seg-group">
                <label>Show</label>
                <div class="seg-buttons" id="scopeFilter">
                  <button type="button" class="seg-btn" data-scope="last30" aria-pressed="true">Last 30 days</button>
                  <button type="button" class="seg-btn" data-scope="month" aria-pressed="false">Month</button>
                  <button type="button" class="seg-btn" data-scope="all" aria-pressed="false">All time</button>
                </div>
              </div>
              <div class="seg-group" id="monthPickerGroup" hidden>
                <label>Which month</label>
                <select id="monthPicker"></select>
              </div>
              <div class="seg-group">
                <label>Status</label>
                <div class="seg-buttons" id="statusFilter">
                  <button type="button" class="seg-btn" data-status="not_started" aria-pressed="true">Open</button>
                  <button type="button" class="seg-btn" data-status="in_progress" aria-pressed="true">In progress</button>
                  <button type="button" class="seg-btn" data-status="paused" aria-pressed="true">Paused</button>
                  <button type="button" class="seg-btn" data-status="completed" aria-pressed="true">Completed</button>
                </div>
              </div>
            </div>
            <button class="primary" id="createTaskBtn" type="button">+ Create task</button>
          </div>
        </div>
        <div class="panel" style="margin-top:16px;">
          <div id="taskPageList"></div>
        </div>
      </div>

      <div id="taskCreatePage" class="narrow" hidden>
        <div class="panel">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <h2 style="margin:0;">Create task</h2>
            <button class="ghost" id="cancelCreateBtn" type="button">&larr; Back</button>
          </div>
          <div class="field" style="margin-top:12px;">
            <label for="newTaskName">Title</label>
            <input id="newTaskName" type="text" placeholder="e.g. Refactor billing module">
          </div>
          <div class="field" style="margin-top:12px;">
            <label for="newTaskDesc">Description</label>
            <textarea id="newTaskDesc" rows="10" placeholder="Extra detail, notes, links…"></textarea>
          </div>
          <div class="row" style="margin-top:12px;">
            <div class="field">
              <label for="newTaskStatus">Status</label>
              <select id="newTaskStatus">
                <option value="not_started" selected>Open</option>
                <option value="in_progress">In progress</option>
                <option value="paused">Paused</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="field">
              <label for="newTaskParentInput">Parent task</label>
              <div class="combo">
                <input type="text" id="newTaskParentInput" placeholder="Search a task, or leave blank" autocomplete="off">
                <div class="combo-dropdown" id="newTaskParentDropdown" hidden></div>
              </div>
            </div>
          </div>
          <div class="row" style="margin-top:16px;">
            <button class="primary" id="addTaskBtn" type="button">Save task</button>
          </div>
        </div>
      </div>

      <div id="taskDetailPage" class="narrow" hidden>
        <div class="panel">
          <div class="row" style="justify-content:flex-end; gap:8px;">
            <button class="ghost" id="createSubtaskBtn" type="button">+ Create subtask</button>
            <button class="ghost" id="backFromDetailBtn" type="button">&larr; Back</button>
          </div>
          <div class="field" style="margin-top:10px;">
            <label for="detailName">Title</label>
            <input type="text" id="detailName">
          </div>
          <p class="task-row-date" id="detailMeta"></p>
          <div class="field" style="margin-top:10px;">
            <label for="detailStatus">Status</label>
            <select id="detailStatus"></select>
          </div>
          <div class="field" style="margin-top:12px;">
            <label for="detailDescription">Description</label>
            <textarea id="detailDescription" rows="10" placeholder="Add detail…"></textarea>
          </div>
          <div id="detailSubtasksSection" style="margin-top:16px;">
            <label>Subtasks</label>
            <div id="detailSubtasks" style="margin-top:6px;"></div>
          </div>
          <div style="margin-top:16px;">
            <label>History</label>
            <div id="detailHistory" style="margin-top:6px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="historyView" hidden>
      <div id="historyContent"></div>
    </div>
  </section>

  <footer>Your events, your Sheet, your Google account only.</footer>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  const CLIENT_ID = '238839451728-qjhhmocvap3kk5chei3bv17n2hkjr0am.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/spreadsheets';
  const SHEET_STORAGE = 'dt_sheet_id';
  const TAB_NAME = 'Sheet1';
  const TASKS_TAB = 'Tasks';
  const TASK_HISTORY_TAB = 'TaskHistory';
  const STATUS_ORDER = ['not_started', 'in_progress', 'paused', 'completed'];
  const STATUS_LABELS = { not_started: 'Open', in_progress: 'In progress', paused: 'Paused', completed: 'Completed' };
  const TASKS_HEADER = ['TaskID', 'Name', 'Description', 'Status', 'ParentID', 'CreatedAt', 'UpdatedAt'];
  const TASK_HISTORY_HEADER = ['TaskID', 'FromStatus', 'ToStatus', 'ChangedAt'];

  const setup = document.getElementById('setup');
  const settingsPanel = document.getElementById('settingsPanel');
  const settingsBtn = document.getElementById('settingsBtn');
  const app = document.getElementById('app');
  const feedback = document.getElementById('feedback');
  const setupFeedback = document.getElementById('setupFeedback');
  const eventsEl = document.getElementById('events');
  const todayHeading = document.getElementById('todayHeading');
  const signInRow = document.getElementById('signInRow');
  const todayTab = document.getElementById('todayTab');
  const historyTab = document.getElementById('historyTab');
  const tasksTab = document.getElementById('tasksTab');
  const todayView = document.getElementById('todayView');
  const historyView = document.getElementById('historyView');
  const tasksView = document.getElementById('tasksView');
  const historyContent = document.getElementById('historyContent');
  const taskPageList = document.getElementById('taskPageList');
  const newTaskName = document.getElementById('newTaskName');
  const newTaskDesc = document.getElementById('newTaskDesc');
  const newTaskStatus = document.getElementById('newTaskStatus');
  const newTaskParentInput = document.getElementById('newTaskParentInput');
  const newTaskParentDropdown = document.getElementById('newTaskParentDropdown');
  const taskListPage = document.getElementById('taskListPage');
  const taskCreatePage = document.getElementById('taskCreatePage');
  const taskDetailPage = document.getElementById('taskDetailPage');
  const createTaskBtn = document.getElementById('createTaskBtn');
  const cancelCreateBtn = document.getElementById('cancelCreateBtn');
  const createSubtaskBtn = document.getElementById('createSubtaskBtn');
  const backFromDetailBtn = document.getElementById('backFromDetailBtn');
  const detailName = document.getElementById('detailName');
  const detailMeta = document.getElementById('detailMeta');
  const detailStatus = document.getElementById('detailStatus');
  const detailDescription = document.getElementById('detailDescription');
  const detailSubtasksSection = document.getElementById('detailSubtasksSection');
  const detailSubtasks = document.getElementById('detailSubtasks');
  const detailHistory = document.getElementById('detailHistory');

  let tokenClient = null;
  let accessToken = null;
  let sheetId = null;
  let logRows = []; // {row, date, eventId, title, start, attended, productive, tasks:[{taskId,done}]}
  let tasksList = []; // {row, id, name, description, status, parentId, createdAt, updatedAt}
  let tasksById = {};
  let taskHistoryByTaskId = {};
  let saveTimers = {};
  let taskFilterScope = 'last30'; // 'last30' | 'month' | 'all'
  let taskFilterMonth = '';
  let taskFilterStatuses = new Set(STATUS_ORDER);
  let newTaskParentId = '';
  let currentDetailTask = null;
  let createReturnTask = null; // task whose detail page to return to after save/cancel, or null for the list

  function getSheetId(){ try{ return localStorage.getItem(SHEET_STORAGE) || ''; }catch(e){ return ''; } }
  function setSheetId(v){ try{ localStorage.setItem(SHEET_STORAGE, v); }catch(e){} }
  function clearSheetId(){ try{ localStorage.removeItem(SHEET_STORAGE); }catch(e){} }

  function extractSheetId(input){
    input = (input || '').trim();
    const m = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(m) return m[1];
    if(/^[a-zA-Z0-9-_]{20,}$/.test(input)) return input;
    return '';
  }

  function showFeedback(el, msg, ok){
    el.innerHTML = '';
    if(!msg) return;
    const div = document.createElement('div');
    div.className = 'notice' + (ok ? ' ok' : '');
    div.textContent = msg;
    el.appendChild(div);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function generateId(){
    return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function colLetter(n){
    let s = '';
    while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  function todayStr(d){
    d = d || new Date();
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function isoWithOffset(d){
    const pad = n => String(n).padStart(2,'0');
    const offsetMin = -d.getTimezoneOffset();
    const sign = offsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(offsetMin);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+sign+pad(Math.floor(abs/60))+':'+pad(abs%60);
  }
  function fmtTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  // ---------- Auth ----------

  function initGis(){
    if(!window.google || !google.accounts) { setTimeout(initGis, 200); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function(resp){
        if(resp.error){ showFeedback(setupFeedback, 'Sign-in failed: ' + resp.error, false); return; }
        accessToken = resp.access_token;
        onSignedIn();
      }
    });
    signInRow.hidden = false;
  }

  document.getElementById('signInBtn').addEventListener('click', function(){
    tokenClient.requestAccessToken();
  });

  function apiFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + accessToken });
    return fetch(url, opts).then(function(r){
      if(!r.ok){
        return r.json().catch(function(){ return null; }).then(function(body){
          const msg = body && body.error && body.error.message ? body.error.message : ('HTTP ' + r.status);
          const err = new Error(msg);
          err.status = r.status;
          throw err;
        });
      }
      return r.json();
    });
  }

  function seedTestData(){
    const now = new Date();
    function daysAgo(n){ const d = new Date(now); d.setDate(d.getDate() - n); return d; }
    function iso(d){ return d.toISOString(); }

    const items = [
      ['Write Q3 report', 'Summarize revenue, churn, and hiring numbers for the board deck.\nPull charts from the finance dashboard and get sign-off from the CFO before Friday.'],
      ['Refactor auth module', 'Session handling still uses the old cookie-based flow.\nMigrate to the token refresh pattern and remove the legacy middleware once the new path is verified in staging.'],
      ['Plan sprint 14', 'Groom the backlog with the team, size the carried-over tickets from sprint 13, and lock the sprint goal by Monday standup.'],
      ['Fix flaky checkout test', 'The checkout E2E test fails intermittently in CI, seemingly a race condition around the payment webhook mock.\nAdd a proper wait condition instead of the fixed sleep.'],
      ['Draft onboarding doc', 'New hires currently rely on tribal knowledge for local setup.\nWrite a step-by-step doc covering repo access, env vars, and the first PR checklist.'],
      ['Migrate database indexes', 'Query plans show a full table scan on the orders table for the reporting queries.\nAdd a composite index and verify against a staging snapshot before running on prod.'],
      ['Review PR backlog', 'Eight PRs have been open for over a week.\nTriage which are still relevant, ping the authors on stale ones, and clear whatever is ready to merge.'],
      ['Design landing page v2', 'Current landing page has a 2% conversion rate.\nSketch a new hero section and pricing layout, then hand off to the designer for mockups.'],
      ['Set up monitoring alerts', 'No alert fires when the queue backs up past a few thousand jobs.\nWire up a threshold alert in the existing monitoring dashboard and route it to the on-call channel.'],
      ['Clean up dead code', 'The old v1 export pipeline is unused but still in the codebase.\nConfirm nothing references it, then delete the module and its tests.'],
      ['Interview candidates', 'Three backend candidates in the pipeline this week.\nPrep the system design question and coordinate debrief time with the panel.'],
      ['Update dependency versions', 'Several packages are two major versions behind, including one with a known CVE.\nUpdate incrementally and run the full test suite after each bump.'],
      ['Prepare demo for stakeholders', 'Quarterly demo is Thursday.\nPull together the three features shipped this quarter into a short walkthrough script.'],
      ['Research caching strategy', 'Repeated identical API calls are adding latency.\nCompare an in-memory cache vs. a Redis layer and write a short recommendation.'],
      ['Fix mobile layout bug', 'The settings page overflows horizontally on narrow screens below 360px.\nTrack down the offending fixed-width element and make it responsive.'],
      ['Write unit tests for billing', 'The billing module has almost no test coverage around proration logic.\nAdd tests for the edge cases: mid-cycle upgrades, downgrades, and cancellations.'],
      ['Optimize image pipeline', 'Uploaded images are stored at full resolution with no compression.\nAdd a resize + compress step on upload and backfill existing assets.'],
      ['Draft privacy policy update', 'New analytics vendor requires a policy update.\nDraft the new section and send to legal for review before publishing.'],
      ['Consolidate API error handling', 'Error responses are inconsistent across endpoints — some return plain strings, others structured JSON.\nStandardize on one error shape across the API.'],
      ['Plan Q4 roadmap', 'Gather input from each team lead on their top priority, then draft the roadmap doc for leadership review.']
    ];
    const statuses = ['not_started', 'in_progress', 'paused', 'completed'];
    const tasks = [];
    const history = [];

    items.forEach(function(item, i){
      const name = item[0];
      const description = item[1];
      const createdDaysAgo = 5 + i * 4.3; // spreads across ~90 days
      const status = statuses[i % 4];
      const id = 'seed_' + Date.now().toString(36) + '_' + i;
      const createdAt = iso(daysAgo(createdDaysAgo));
      let updatedAt = createdAt;
      history.push({ taskId: id, from: '', to: 'not_started', changedAt: createdAt });
      if(status !== 'not_started'){
        const p1 = iso(daysAgo(createdDaysAgo - 1));
        history.push({ taskId: id, from: 'not_started', to: 'in_progress', changedAt: p1 });
        updatedAt = p1;
        if(status === 'paused'){
          const p2 = iso(daysAgo(createdDaysAgo - 3));
          history.push({ taskId: id, from: 'in_progress', to: 'paused', changedAt: p2 });
          updatedAt = p2;
        } else if(status === 'completed'){
          const p2 = iso(daysAgo(createdDaysAgo - 5));
          history.push({ taskId: id, from: 'in_progress', to: 'completed', changedAt: p2 });
          updatedAt = p2;
        }
      }
      tasks.push({ id: id, name: '[Sample] ' + name, description: description, status: status, parentId: '', createdAt: createdAt, updatedAt: updatedAt });
    });

    // A parent with subtasks, all completed, to exercise the auto-complete rollup.
    const parentId = 'seed_' + Date.now().toString(36) + '_parent';
    const parentCreated = iso(daysAgo(20));
    history.push({ taskId: parentId, from: '', to: 'not_started', changedAt: parentCreated });
    tasks.push({ id: parentId, name: '[Sample] Ship v2 launch', description: 'Umbrella task for the v2 launch write-up.\nBreaks down into the subtasks below — this one auto-completes once all of them are done.', status: 'not_started', parentId: '', createdAt: parentCreated, updatedAt: parentCreated });
    const subItems = [
      ['Draft outline', 'Rough out the sections: what shipped, why it matters, what\'s next.'],
      ['Collect data', 'Pull adoption numbers from the last two weeks to back up the key claims.'],
      ['Write summary', 'Turn the outline and data into a final draft ready for review.']
    ];
    subItems.forEach(function(item, i){
      const subId = 'seed_' + Date.now().toString(36) + '_sub' + i;
      const subCreated = iso(daysAgo(18 - i * 2));
      const subDone = iso(daysAgo(10 - i * 2));
      history.push({ taskId: subId, from: '', to: 'not_started', changedAt: subCreated });
      history.push({ taskId: subId, from: 'not_started', to: 'completed', changedAt: subDone });
      tasks.push({ id: subId, name: '[Sample] ' + item[0], description: item[1], status: 'completed', parentId: parentId, createdAt: subCreated, updatedAt: subDone });
    });
    const parentTask = tasks.find(function(t){ return t.id === parentId; });
    parentTask.status = 'completed';
    parentTask.updatedAt = iso(daysAgo(9));
    history.push({ taskId: parentId, from: 'not_started', to: 'completed', changedAt: parentTask.updatedAt });

    const taskRows = tasks.map(function(t){ return [t.id, t.name, t.description, t.status, t.parentId, t.createdAt, t.updatedAt]; });
    const historyRows = history.map(function(h){ return [h.taskId, h.from, h.to, h.changedAt]; });

    return ensureAppSheets().then(function(){
      return apiFetch(sheetRangeUrl(TASKS_TAB + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: taskRows })
      });
    }).then(function(){
      return apiFetch(sheetRangeUrl(TASK_HISTORY_TAB + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: historyRows })
      });
    }).then(function(){
      return Promise.all([loadTasks(), loadTaskHistory()]);
    });
  }

  // ---------- Sheets helpers ----------

  function sheetRangeUrl(range){
    return 'https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + '/values/' + encodeURIComponent(range);
  }

  function ensureHeader(){
    return apiFetch(sheetRangeUrl(TAB_NAME + '!A1:H1')).then(function(data){
      if(data.values && data.values.length) return;
      return apiFetch(sheetRangeUrl(TAB_NAME + '!A1:H1') + '?valueInputOption=RAW', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [['Date','EventID','Title','Start','Attended','Productive','Tasks','UpdatedAt']] })
      });
    });
  }

  function loadLogRows(){
    return apiFetch(sheetRangeUrl(TAB_NAME + '!A2:H5000')).then(function(data){
      logRows = (data.values || []).map(function(r, i){
        let tasks = [];
        try{ tasks = JSON.parse(r[6] || '[]'); }catch(e){ tasks = []; }
        return {
          row: i + 2,
          date: r[0] || '',
          eventId: r[1] || '',
          title: r[2] || '',
          start: r[3] || '',
          attended: r[4] === 'TRUE',
          productive: r[5] === 'TRUE',
          tasks: tasks
        };
      });
    });
  }

  function findLogRow(date, eventId){
    for(let i = 0; i < logRows.length; i++){
      if(logRows[i].date === date && logRows[i].eventId === eventId) return logRows[i];
    }
    return null;
  }

  function upsertLog(entry){
    const values = [[entry.date, entry.eventId, entry.title, entry.start,
      entry.attended ? 'TRUE' : 'FALSE', entry.productive ? 'TRUE' : 'FALSE',
      JSON.stringify(entry.tasks), new Date().toISOString()]];
    const existing = findLogRow(entry.date, entry.eventId);
    if(existing){
      const range = TAB_NAME + '!A' + existing.row + ':H' + existing.row;
      return apiFetch(sheetRangeUrl(range) + '?valueInputOption=RAW', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: values })
      }).then(function(){
        Object.assign(existing, entry);
      });
    } else {
      return apiFetch(sheetRangeUrl(TAB_NAME + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: values })
      }).then(function(resp){
        let row = logRows.length + 2;
        const m = resp.updates && resp.updates.updatedRange && resp.updates.updatedRange.match(/![A-Z]+(\d+)/);
        if(m) row = parseInt(m[1], 10);
        const rec = Object.assign({ row: row }, entry);
        logRows.push(rec);
      });
    }
  }

  // ---------- Schema migration ----------
  // Reads whatever header a tab currently has and remaps existing rows into the
  // expected column layout by field name, so adding/reordering columns later
  // never requires clearing data by hand.

  function migrateSheetSchema(tabName, expectedHeader){
    return apiFetch(sheetRangeUrl(tabName + '!A1:Z1')).then(function(data){
      const existingHeader = (data.values && data.values[0]) || [];
      const lastCol = colLetter(expectedHeader.length);

      if(existingHeader.length === 0){
        return apiFetch(sheetRangeUrl(tabName + '!A1:' + lastCol + '1') + '?valueInputOption=RAW', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: [expectedHeader] })
        });
      }

      const same = existingHeader.length === expectedHeader.length &&
        existingHeader.every(function(h, i){ return h === expectedHeader[i]; });
      if(same) return;

      return apiFetch(sheetRangeUrl(tabName + '!A2:Z5000')).then(function(rowsData){
        const rows = rowsData.values || [];
        const remapped = rows.map(function(r){
          const obj = {};
          existingHeader.forEach(function(h, i){ obj[h] = r[i] !== undefined ? r[i] : ''; });
          return expectedHeader.map(function(h){ return obj[h] !== undefined ? obj[h] : ''; });
        });
        const allValues = [expectedHeader].concat(remapped);
        return apiFetch(sheetRangeUrl(tabName + '!A1:' + lastCol + allValues.length) + '?valueInputOption=RAW', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: allValues })
        });
      });
    });
  }

  // ---------- Tasks + task history ----------

  function ensureAppSheets(){
    return apiFetch('https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + '?fields=sheets.properties.title')
      .then(function(meta){
        const titles = (meta.sheets || []).map(function(s){ return s.properties.title; });
        const requests = [];
        if(titles.indexOf(TASKS_TAB) === -1) requests.push({ addSheet: { properties: { title: TASKS_TAB } } });
        if(titles.indexOf(TASK_HISTORY_TAB) === -1) requests.push({ addSheet: { properties: { title: TASK_HISTORY_TAB } } });
        if(requests.length === 0) return;
        return apiFetch('https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + ':batchUpdate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requests: requests })
        });
      }).then(function(){
        return Promise.all([
          migrateSheetSchema(TASKS_TAB, TASKS_HEADER),
          migrateSheetSchema(TASK_HISTORY_TAB, TASK_HISTORY_HEADER)
        ]);
      });
  }

  function loadTasks(){
    return apiFetch(sheetRangeUrl(TASKS_TAB + '!A2:G5000')).then(function(data){
      tasksList = (data.values || []).map(function(r, i){
        return {
          row: i + 2, id: r[0] || '', name: r[1] || '', description: r[2] || '',
          status: r[3] || 'not_started', parentId: r[4] || '', createdAt: r[5] || '', updatedAt: r[6] || ''
        };
      });
      tasksById = {};
      tasksList.forEach(function(t){ tasksById[t.id] = t; });
    });
  }

  function loadTaskHistory(){
    return apiFetch(sheetRangeUrl(TASK_HISTORY_TAB + '!A2:D5000')).then(function(data){
      taskHistoryByTaskId = {};
      (data.values || []).forEach(function(r){
        const entry = { taskId: r[0] || '', from: r[1] || '', to: r[2] || '', changedAt: r[3] || '' };
        if(!taskHistoryByTaskId[entry.taskId]) taskHistoryByTaskId[entry.taskId] = [];
        taskHistoryByTaskId[entry.taskId].push(entry);
      });
    });
  }

  function logTaskHistory(taskId, fromStatus, toStatus, changedAt){
    const entry = { taskId: taskId, from: fromStatus, to: toStatus, changedAt: changedAt };
    return apiFetch(sheetRangeUrl(TASK_HISTORY_TAB + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[taskId, fromStatus, toStatus, changedAt]] })
    }).then(function(){
      if(!taskHistoryByTaskId[taskId]) taskHistoryByTaskId[taskId] = [];
      taskHistoryByTaskId[taskId].push(entry);
    });
  }

  function saveTaskRow(task){
    const range = TASKS_TAB + '!A' + task.row + ':G' + task.row;
    return apiFetch(sheetRangeUrl(range) + '?valueInputOption=RAW', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[task.id, task.name, task.description || '', task.status, task.parentId || '', task.createdAt, task.updatedAt]] })
    });
  }

  function createTask(name, description, status, parentId){
    const now = new Date().toISOString();
    const task = { id: generateId(), name: name, description: description || '', status: status, parentId: parentId || '', createdAt: now, updatedAt: now };
    return apiFetch(sheetRangeUrl(TASKS_TAB + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[task.id, task.name, task.description, task.status, task.parentId, task.createdAt, task.updatedAt]] })
    }).then(function(resp){
      let row = tasksList.length + 2;
      const m = resp.updates && resp.updates.updatedRange && resp.updates.updatedRange.match(/![A-Z]+(\d+)/);
      if(m) row = parseInt(m[1], 10);
      task.row = row;
      tasksList.push(task);
      tasksById[task.id] = task;
      return logTaskHistory(task.id, '', task.status, now).then(function(){ return task; });
    });
  }

  function updateTaskStatus(task, newStatus){
    const oldStatus = task.status;
    if(oldStatus === newStatus) return Promise.resolve();
    task.status = newStatus;
    task.updatedAt = new Date().toISOString();
    return saveTaskRow(task).then(function(){
      return logTaskHistory(task.id, oldStatus, newStatus, task.updatedAt);
    });
  }

  function updateTaskDescription(task, newDescription){
    task.description = newDescription;
    task.updatedAt = new Date().toISOString();
    return saveTaskRow(task);
  }

  function updateTaskName(task, newName){
    task.name = newName;
    task.updatedAt = new Date().toISOString();
    return saveTaskRow(task).then(function(){
      renderChipsEverywhere();
    });
  }

  // A task with children is a "parent" and isn't itself directly attachable to an event.
  function isAttachable(task){
    return !tasksList.some(function(t){ return t.parentId === task.id; });
  }

  // When every sibling under a parent is completed, auto-complete the parent too.
  function maybeCompleteParent(task){
    if(!task.parentId) return Promise.resolve();
    const parent = tasksById[task.parentId];
    if(!parent || parent.status === 'completed') return Promise.resolve();
    const siblings = tasksList.filter(function(t){ return t.parentId === task.parentId; });
    if(siblings.length && siblings.every(function(s){ return s.status === 'completed'; })){
      return updateTaskStatus(parent, 'completed');
    }
    return Promise.resolve();
  }

  function renderDetailHistory(task){
    const entries = (taskHistoryByTaskId[task.id] || []).slice()
      .sort(function(a, b){ return (a.changedAt || '').localeCompare(b.changedAt || ''); });
    if(entries.length === 0){ detailHistory.innerHTML = '<p class="empty">No history yet.</p>'; return; }
    detailHistory.innerHTML = entries.map(function(h){
      const label = h.from
        ? (STATUS_LABELS[h.from] || h.from) + ' → <b>' + (STATUS_LABELS[h.to] || h.to) + '</b>'
        : 'Created as <b>' + (STATUS_LABELS[h.to] || h.to) + '</b>';
      const when = h.changedAt ? new Date(h.changedAt).toLocaleString() : '';
      return '<div class="history-item">' + escapeHtml(when) + ' — ' + label + '</div>';
    }).join('');
  }

  function renderDetailSubtasks(task){
    const subs = tasksList.filter(function(t){ return t.parentId === task.id; })
      .sort(function(a, b){ return (a.createdAt || '').localeCompare(b.createdAt || ''); });
    detailSubtasks.innerHTML = '';
    if(subs.length === 0){ detailSubtasks.innerHTML = '<p class="empty">No subtasks yet.</p>'; return; }
    subs.forEach(function(sub){
      detailSubtasks.appendChild(renderTaskRow(sub, function(){
        renderDetailSubtasks(task);
        detailStatus.value = task.status;
        renderDetailHistory(task);
      }));
    });
  }

  function showTaskDetailPage(task){
    taskListPage.hidden = true;
    taskCreatePage.hidden = true;
    taskDetailPage.hidden = false;
    currentDetailTask = task;
    const isSubtask = !!task.parentId;
    createSubtaskBtn.hidden = isSubtask; // subtasks can't themselves have subtasks
    detailSubtasksSection.hidden = isSubtask;

    detailName.value = task.name;
    detailMeta.textContent = 'Created ' + (task.createdAt ? new Date(task.createdAt).toLocaleString() : '') +
      (task.parentId && tasksById[task.parentId] ? ' · Subtask of ' + tasksById[task.parentId].name : '');
    detailStatus.innerHTML = STATUS_ORDER.map(function(s){
      return '<option value="' + s + '"' + (s === task.status ? ' selected' : '') + '>' + STATUS_LABELS[s] + '</option>';
    }).join('');
    detailDescription.value = task.description || '';
    if(!isSubtask) renderDetailSubtasks(task);
    renderDetailHistory(task);

    detailStatus.onchange = function(e){
      updateTaskStatus(task, e.target.value).then(function(){
        return maybeCompleteParent(task);
      }).then(function(){
        renderDetailHistory(task);
        renderChipsEverywhere();
      });
    };
    let nameTimer;
    detailName.oninput = function(){
      clearTimeout(nameTimer);
      nameTimer = setTimeout(function(){
        const val = detailName.value.trim();
        if(!val) return;
        updateTaskName(task, val);
      }, 600);
    };
    let descTimer;
    detailDescription.oninput = function(){
      clearTimeout(descTimer);
      descTimer = setTimeout(function(){
        updateTaskDescription(task, detailDescription.value);
      }, 600);
    };
  }

  createTaskBtn.addEventListener('click', function(){ showTaskCreatePage(); });
  createSubtaskBtn.addEventListener('click', function(){ showTaskCreatePage(currentDetailTask); });
  cancelCreateBtn.addEventListener('click', function(){
    newTaskName.value = '';
    newTaskDesc.value = '';
    newTaskStatus.value = 'not_started';
    returnFromCreatePage();
  });
  backFromDetailBtn.addEventListener('click', showTaskListPage);

  function closeParentDropdown(){ newTaskParentDropdown.hidden = true; newTaskParentDropdown.innerHTML = ''; }

  function openParentDropdown(){
    const q = newTaskParentInput.value.trim().toLowerCase();
    const options = tasksList.filter(function(t){ return !t.parentId; })
      .filter(function(t){ return !q || t.name.toLowerCase().indexOf(q) !== -1; })
      .sort(function(a, b){ return (a.name || '').localeCompare(b.name || ''); });

    newTaskParentDropdown.innerHTML = '';

    const noneOpt = document.createElement('div');
    noneOpt.className = 'combo-option';
    noneOpt.innerHTML = '<span>No parent (top-level)</span>';
    noneOpt.addEventListener('mousedown', function(e){ e.preventDefault(); });
    noneOpt.addEventListener('click', function(){
      newTaskParentId = '';
      newTaskParentInput.value = '';
      closeParentDropdown();
    });
    newTaskParentDropdown.appendChild(noneOpt);

    options.slice(0, 30).forEach(function(t){
      const opt = document.createElement('div');
      opt.className = 'combo-option';
      opt.innerHTML = '<span>' + escapeHtml(t.name) + '</span><span class="badge ' + t.status + '">' + STATUS_LABELS[t.status] + '</span>';
      opt.addEventListener('mousedown', function(e){ e.preventDefault(); });
      opt.addEventListener('click', function(){
        newTaskParentId = t.id;
        newTaskParentInput.value = t.name;
        closeParentDropdown();
      });
      newTaskParentDropdown.appendChild(opt);
    });

    newTaskParentDropdown.hidden = false;
  }

  newTaskParentInput.addEventListener('focus', openParentDropdown);
  newTaskParentInput.addEventListener('input', function(){
    newTaskParentId = '';
    openParentDropdown();
  });
  newTaskParentInput.addEventListener('blur', function(){ setTimeout(closeParentDropdown, 150); });
  newTaskParentInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      const firstOpt = newTaskParentDropdown.querySelector('.combo-option');
      if(firstOpt) firstOpt.click();
    }
  });

  // ---------- Tasks page ----------

  function renderTaskRow(t, onChanged){
    const row = document.createElement('div');
    row.className = 'task-row';
    const parentLabel = (t.parentId && tasksById[t.parentId])
      ? ('<span class="task-row-date">Subtask of ' + escapeHtml(tasksById[t.parentId].name) + '</span>') : '';
    row.innerHTML =
      '<div class="task-row-main">' +
        '<button type="button" class="task-row-name">' + escapeHtml(t.name) + '</button>' +
        '<span class="task-row-date">Created ' + (t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '') + '</span>' +
        parentLabel +
      '</div>' +
      '<select>' + STATUS_ORDER.map(function(s){
        return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + STATUS_LABELS[s] + '</option>';
      }).join('') + '</select>';
    row.querySelector('.task-row-name').addEventListener('click', function(){ showTaskDetailPage(t); });
    row.querySelector('select').addEventListener('change', function(e){
      updateTaskStatus(t, e.target.value).then(function(){
        return maybeCompleteParent(t);
      }).then(function(){
        renderChipsEverywhere();
        if(onChanged) onChanged(); else renderTasksPage();
      });
    });
    return row;
  }

  function monthKey(d){
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }

  function populateMonthPicker(){
    const keys = Array.from(new Set(tasksList.map(function(t){
      return t.createdAt ? monthKey(new Date(t.createdAt)) : null;
    }).filter(Boolean)));
    const currentKey = monthKey(new Date());
    if(keys.indexOf(currentKey) === -1) keys.push(currentKey);
    keys.sort().reverse();
    const current = taskFilterMonth || currentKey;
    monthPicker.innerHTML = keys.map(function(k){
      const d = new Date(k + '-01T00:00:00');
      const label = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      return '<option value="' + k + '"' + (k === current ? ' selected' : '') + '>' + label + '</option>';
    }).join('');
    taskFilterMonth = monthPicker.value;
  }

  function applyTaskFilters(list){
    const now = new Date();
    return list.filter(function(t){
      if(!taskFilterStatuses.has(t.status)) return false;
      if(taskFilterScope === 'all') return true;
      if(!t.createdAt) return false;
      const d = new Date(t.createdAt);
      if(taskFilterScope === 'last30'){
        const diffDays = (now - d) / 86400000;
        return diffDays >= 0 && diffDays <= 30;
      }
      if(taskFilterScope === 'month'){
        return monthKey(d) === taskFilterMonth;
      }
      return true;
    });
  }

  function renderTasksPage(){
    taskPageList.innerHTML = '';
    const filtered = applyTaskFilters(tasksList)
      .sort(function(a, b){ return (b.createdAt || '').localeCompare(a.createdAt || ''); });
    if(filtered.length === 0){
      taskPageList.innerHTML = '<p class="empty">No tasks match the current filters.</p>';
      return;
    }
    filtered.forEach(function(t){ taskPageList.appendChild(renderTaskRow(t)); });
  }

  const monthPickerGroup = document.getElementById('monthPickerGroup');
  const monthPicker = document.getElementById('monthPicker');

  document.querySelectorAll('#scopeFilter .seg-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      taskFilterScope = btn.dataset.scope;
      document.querySelectorAll('#scopeFilter .seg-btn').forEach(function(b){ b.setAttribute('aria-pressed', String(b === btn)); });
      monthPickerGroup.hidden = taskFilterScope !== 'month';
      if(taskFilterScope === 'month') populateMonthPicker();
      renderTasksPage();
    });
  });
  monthPicker.addEventListener('change', function(){
    taskFilterMonth = monthPicker.value;
    renderTasksPage();
  });
  document.querySelectorAll('#statusFilter .seg-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const s = btn.dataset.status;
      if(taskFilterStatuses.has(s)){ taskFilterStatuses.delete(s); btn.setAttribute('aria-pressed', 'false'); }
      else { taskFilterStatuses.add(s); btn.setAttribute('aria-pressed', 'true'); }
      renderTasksPage();
    });
  });

  let chipRefreshFns = [];
  function renderChipsEverywhere(){
    chipRefreshFns.forEach(function(fn){ fn(); });
  }

  document.getElementById('addTaskBtn').addEventListener('click', function(){
    const name = newTaskName.value.trim();
    if(!name) return;
    createTask(name, newTaskDesc.value.trim(), newTaskStatus.value, newTaskParentId).then(function(){
      newTaskName.value = '';
      newTaskDesc.value = '';
      newTaskStatus.value = 'not_started';
      returnFromCreatePage();
    });
  });
  newTaskName.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('addTaskBtn').click(); }
  });

  // ---------- Today view ----------

  function renderEvents(events){
    eventsEl.innerHTML = '';
    chipRefreshFns = [];
    if(events.length === 0){
      eventsEl.innerHTML = '<p class="empty">No events on your calendar today.</p>';
      return;
    }
    const date = todayStr();
    events.forEach(function(ev){
      const startIso = ev.start.dateTime || ev.start.date;
      const existing = findLogRow(date, ev.id) || { attended: false, productive: false, tasks: [] };

      const card = document.createElement('div');
      card.className = 'panel event-card';

      const state = {
        date: date, eventId: ev.id, title: ev.summary || 'Untitled', start: startIso,
        attended: existing.attended, productive: existing.productive,
        tasks: (existing.tasks || []).map(function(t){ return Object.assign({}, t); })
      };

      card.innerHTML =
        '<div>' +
          '<div class="event-time">' + escapeHtml(fmtTime(ev.start.dateTime)) + (ev.start.date ? 'All day' : '') + '</div>' +
          '<div class="event-title">' + escapeHtml(state.title) + '</div>' +
        '</div>' +
        '<div class="segmented">' +
          '<div class="seg-group"><label>Attended</label><div class="seg-buttons" data-role="attended">' +
            '<button type="button" class="seg-btn yes" aria-pressed="' + (state.attended) + '">Yes</button>' +
            '<button type="button" class="seg-btn no" aria-pressed="' + (!state.attended) + '">No</button>' +
          '</div></div>' +
          '<div class="seg-group"><label>Productive</label><div class="seg-buttons" data-role="productive">' +
            '<button type="button" class="seg-btn yes" aria-pressed="' + (state.productive) + '">Yes</button>' +
            '<button type="button" class="seg-btn no" aria-pressed="' + (!state.productive) + '">No</button>' +
          '</div></div>' +
        '</div>' +
        '<div class="seg-group"><label>Tasks</label>' +
          '<div class="chips" data-role="taskChips"></div>' +
          '<div class="combo">' +
            '<input type="text" data-role="taskCombo" placeholder="Search or add a task" autocomplete="off">' +
            '<div class="combo-dropdown" data-role="taskDropdown" hidden></div>' +
          '</div>' +
        '</div>' +
        '<span class="save-state" data-role="saveState"></span>';

      eventsEl.appendChild(card);

      const saveStateEl = card.querySelector('[data-role="saveState"]');
      function scheduleSave(){
        saveStateEl.textContent = 'Saving…';
        clearTimeout(saveTimers[ev.id]);
        saveTimers[ev.id] = setTimeout(function(){
          upsertLog(state).then(function(){
            saveStateEl.textContent = 'Saved';
          }).catch(function(err){
            saveStateEl.textContent = 'Save failed: ' + err.message;
          });
        }, 500);
      }

      function setPressed(role, yesVal){
        const group = card.querySelector('[data-role="' + role + '"]');
        const buttons = group.querySelectorAll('.seg-btn');
        buttons[0].setAttribute('aria-pressed', String(yesVal));
        buttons[1].setAttribute('aria-pressed', String(!yesVal));
      }

      card.querySelector('[data-role="attended"]').addEventListener('click', function(e){
        const btn = e.target.closest('.seg-btn');
        if(!btn) return;
        state.attended = btn.classList.contains('yes');
        setPressed('attended', state.attended);
        scheduleSave();
      });
      card.querySelector('[data-role="productive"]').addEventListener('click', function(e){
        const btn = e.target.closest('.seg-btn');
        if(!btn) return;
        state.productive = btn.classList.contains('yes');
        setPressed('productive', state.productive);
        scheduleSave();
      });

      // ---- task combo (multi-select existing tasks + inline create) ----
      const chipsEl = card.querySelector('[data-role="taskChips"]');
      const comboInput = card.querySelector('[data-role="taskCombo"]');
      const dropdownEl = card.querySelector('[data-role="taskDropdown"]');

      function renderChips(){
        chipsEl.innerHTML = '';
        state.tasks.forEach(function(link, idx){
          const task = tasksById[link.taskId];
          if(!task) return;
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.innerHTML =
            '<span class="chip-name">' + escapeHtml(task.name) + '</span>' +
            '<span class="badge ' + task.status + '">' + STATUS_LABELS[task.status] + '</span>' +
            '<div class="seg-buttons">' +
              '<button type="button" class="seg-btn yes" aria-pressed="' + link.done + '">Yes</button>' +
              '<button type="button" class="seg-btn no" aria-pressed="' + (!link.done) + '">No</button>' +
            '</div>' +
            '<button type="button" class="remove" aria-label="Unlink task">×</button>';
          const buttons = chip.querySelectorAll('.seg-btn');
          buttons[0].addEventListener('click', function(){
            link.done = true;
            buttons[0].setAttribute('aria-pressed', 'true');
            buttons[1].setAttribute('aria-pressed', 'false');
            scheduleSave();
          });
          buttons[1].addEventListener('click', function(){
            link.done = false;
            buttons[0].setAttribute('aria-pressed', 'false');
            buttons[1].setAttribute('aria-pressed', 'true');
            scheduleSave();
          });
          chip.querySelector('.remove').addEventListener('click', function(){
            state.tasks.splice(idx, 1);
            renderChips();
            scheduleSave();
          });
          chipsEl.appendChild(chip);
        });
      }
      renderChips();
      chipRefreshFns.push(renderChips);

      function closeDropdown(){ dropdownEl.hidden = true; dropdownEl.innerHTML = ''; }

      function openDropdown(){
        const q = comboInput.value.trim().toLowerCase();
        const linkedIds = state.tasks.map(function(l){ return l.taskId; });
        const matches = tasksList.filter(function(t){
          return linkedIds.indexOf(t.id) === -1 && isAttachable(t) && (!q || t.name.toLowerCase().indexOf(q) !== -1);
        }).sort(function(a, b){ return (b.createdAt || '').localeCompare(a.createdAt || ''); });

        dropdownEl.innerHTML = '';
        matches.slice(0, 20).forEach(function(t){
          const opt = document.createElement('div');
          opt.className = 'combo-option';
          opt.innerHTML = '<span>' + escapeHtml(t.name) + '</span><span class="badge ' + t.status + '">' + STATUS_LABELS[t.status] + '</span>';
          opt.addEventListener('mousedown', function(e){ e.preventDefault(); });
          opt.addEventListener('click', function(){
            state.tasks.push({ taskId: t.id, done: false });
            comboInput.value = '';
            closeDropdown();
            renderChips();
            scheduleSave();
          });
          dropdownEl.appendChild(opt);
        });

        const exact = tasksList.some(function(t){ return t.name.toLowerCase() === q; });
        if(q && !exact){
          const createOpt = document.createElement('div');
          createOpt.className = 'combo-option create';
          createOpt.textContent = '+ Create task "' + comboInput.value.trim() + '"';
          createOpt.addEventListener('mousedown', function(e){ e.preventDefault(); });
          createOpt.addEventListener('click', function(){
            const name = comboInput.value.trim();
            createTask(name, '', 'in_progress', '').then(function(task){
              state.tasks.push({ taskId: task.id, done: false });
              comboInput.value = '';
              closeDropdown();
              renderChips();
              scheduleSave();
            });
          });
          dropdownEl.appendChild(createOpt);
        }

        dropdownEl.hidden = dropdownEl.children.length === 0;
      }

      comboInput.addEventListener('focus', openDropdown);
      comboInput.addEventListener('input', openDropdown);
      comboInput.addEventListener('blur', function(){ setTimeout(closeDropdown, 150); });
      comboInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          const firstOpt = dropdownEl.querySelector('.combo-option');
          if(firstOpt) firstOpt.click();
        }
      });
    });
  }

  // ---------- Day-log history view ----------

  function renderHistory(){
    historyContent.innerHTML = '';
    if(logRows.length === 0){
      historyContent.innerHTML = '<p class="empty">Nothing logged yet.</p>';
      return;
    }
    const byTitle = {};
    logRows.forEach(function(r){
      if(!byTitle[r.title]) byTitle[r.title] = { days: 0, attended: 0, productive: 0, tasksTotal: 0, tasksDone: 0 };
      const s = byTitle[r.title];
      s.days++;
      if(r.attended) s.attended++;
      if(r.productive) s.productive++;
      (r.tasks || []).forEach(function(t){ s.tasksTotal++; if(t.done) s.tasksDone++; });
    });

    const summaryPanel = document.createElement('div');
    summaryPanel.className = 'panel';
    summaryPanel.innerHTML = '<h2>By event</h2>';
    const table = document.createElement('table');
    table.className = 'hist';
    table.innerHTML = '<thead><tr><th>Event</th><th>Days</th><th>Attended</th><th>Productive</th><th>Tasks</th></tr></thead>';
    const tbody = document.createElement('tbody');
    Object.keys(byTitle).sort().forEach(function(title){
      const s = byTitle[title];
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(title) + '</td>' +
        '<td>' + s.days + '</td>' +
        '<td>' + Math.round(100 * s.attended / s.days) + '%</td>' +
        '<td>' + Math.round(100 * s.productive / s.days) + '%</td>' +
        '<td>' + (s.tasksTotal ? (s.tasksDone + '/' + s.tasksTotal) : '—') + '</td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    summaryPanel.appendChild(table);
    historyContent.appendChild(summaryPanel);

    const recentPanel = document.createElement('div');
    recentPanel.className = 'panel';
    recentPanel.innerHTML = '<h2>Recent log</h2>';
    const rtable = document.createElement('table');
    rtable.className = 'hist';
    rtable.innerHTML = '<thead><tr><th>Date</th><th>Event</th><th>Attended</th><th>Productive</th><th>Tasks</th></tr></thead>';
    const rbody = document.createElement('tbody');
    logRows.slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.start.localeCompare(a.start); })
      .slice(0, 30).forEach(function(r){
        const done = (r.tasks || []).filter(function(t){ return t.done; }).length;
        const total = (r.tasks || []).length;
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + escapeHtml(r.date) + '</td>' +
          '<td>' + escapeHtml(r.title) + '</td>' +
          '<td>' + (r.attended ? 'Yes' : 'No') + '</td>' +
          '<td>' + (r.productive ? 'Yes' : 'No') + '</td>' +
          '<td>' + (total ? (done + '/' + total) : '—') + '</td>';
        rbody.appendChild(tr);
      });
    rtable.appendChild(rbody);
    recentPanel.appendChild(rtable);
    historyContent.appendChild(recentPanel);
  }

  boot();
})();
</script>
